name: Compile LaTeX

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_paper:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          compiler: latexmk
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit compiled PDF on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- main.pdf; then
            echo "main.pdf already matches the compiled document."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          git commit -m "build(paper): sync main.pdf with v1.0.5 source [skip ci]"
          git push origin HEAD:main

      - name: Publish v1.0.5 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.5 >/dev/null 2>&1; then
            echo "GitHub Release v1.0.5 already exists; no action needed."
            exit 0
          fi
          cp main.pdf The_Enchan_Field_v1.0.5.pdf
          gh release create v1.0.5 The_Enchan_Field_v1.0.5.pdf \
            --target "$(git rev-parse HEAD)" \
            --title "The Enchan Field v1.0.5 — Mathematical Clarifications" \
            --notes-file RELEASE_NOTES_v1.0.5.md \
            --latest

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The_Enchan_Field_Paper
          path: main.pdf
