name: Clarify existing v1.0.5 Release distribution assets

# One-time update of existing Release notes only. No new Release, tag, or assets.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-v105-release-distribution-notice.yml

permissions:
  contents: write

jobs:
  clarify_release_notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update only the existing Release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: EnchanTheory/The-Enchan-Field-Paper
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v1.0.5" > /tmp/release-before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rel = json.loads(Path("/tmp/release-before.json").read_text())
          assert rel["tag_name"] == "v1.0.5"
          body = rel["body"].replace("\r\n", "\n")
          notice = (
              "**Official distribution files:** Please use the attached "
              "`The-Enchan-Field-Paper-v1.0.5.zip` and "
              "`The_Enchan_Field_v1.0.5.pdf`. "
              "GitHub's automatically generated source archives reflect the original "
              "tag snapshot and are not the finalized Zenodo distribution."
          )
          if notice not in body:
              anchor = "## Files\n"
              assert body.count(anchor) == 1, "Could not locate Files heading in existing Release"
              body = body.replace(anchor, anchor + "\n" + notice + "\n", 1)
          Path("/tmp/release-notes.md").write_text(body)
          PY
          gh release edit v1.0.5 --notes-file /tmp/release-notes.md
          gh api "repos/$GH_REPO/releases/tags/v1.0.5" > /tmp/release-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("/tmp/release-before.json").read_text())
          after = json.loads(Path("/tmp/release-after.json").read_text())
          for key in ("id", "tag_name", "name", "published_at", "draft", "prerelease"):
              assert before[key] == after[key], f"Unexpected modification of {key}"
          def asset_manifest(x):
              return [(a["id"], a["name"], a["size"], a.get("digest")) for a in x["assets"]]
          assert asset_manifest(before) == asset_manifest(after), "Release assets changed unexpectedly"
          assert "Official distribution files:" in after["body"]
          assert "not the finalized Zenodo distribution" in after["body"]
          print("Existing Release v1.0.5 body updated. Release identity, publication, tag and assets unchanged.")
          PY
